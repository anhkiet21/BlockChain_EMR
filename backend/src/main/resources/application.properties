spring.application.name=blockchain-emr-api
spring.profiles.default=dev
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api
server.error.include-message=never
server.error.include-stacktrace=never

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.jwt.secret=${JWT_SECRET:development-secret-change-before-production}
app.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:15m}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:7d}
app.wallet.nonce-expiration=${WALLET_NONCE_EXPIRATION:5m}
app.blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:http://localhost:8545}
app.blockchain.contract-address=${BLOCKCHAIN_CONTRACT_ADDRESS:}
app.blockchain.rpc-timeout=${BLOCKCHAIN_RPC_TIMEOUT:5s}
app.blockchain.sync-start-block=${BLOCKCHAIN_SYNC_START_BLOCK:0}
app.ipfs.api-url=${IPFS_API_URL:http://localhost:5001}
app.ipfs.gateway-url=${IPFS_GATEWAY_URL:http://localhost:8081/ipfs}
app.storage.provider=${STORAGE_PROVIDER:kubo}
app.storage.max-file-size-bytes=${STORAGE_MAX_FILE_SIZE_BYTES:20971520}
app.storage.encryption-key=${STORAGE_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
app.pinata.api-url=${PINATA_API_URL:https://api.pinata.cloud}
app.pinata.gateway-url=${PINATA_GATEWAY_URL:}
app.pinata.jwt=${PINATA_JWT:}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-request}] [%thread] %logger{36} - %msg%n
logging.level.root=INFO
logging.level.com.blockchain.emr=INFO
