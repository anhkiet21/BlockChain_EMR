spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.jwt.secret=${JWT_SECRET}
app.storage.encryption-key=${STORAGE_ENCRYPTION_KEY}
app.storage.orphan-cleanup-enabled=${ORPHAN_CLEANUP_ENABLED:true}

logging.level.root=INFO
logging.level.com.blockchain.emr=INFO
logging.file.name=${LOG_FILE:logs/blockchain-emr-api.log}
