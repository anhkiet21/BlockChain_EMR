x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    container_name: emr-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-emr}
      MYSQL_USER: ${MYSQL_USER:-emr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-emr_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  ipfs:
    image: ipfs/kubo:v0.32.1
    container_name: emr-ipfs
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8081:8080"
    volumes:
      - ipfs-data:/data/ipfs
      - ipfs-staging:/export
    logging: *default-logging

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: emr-anvil
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337"]
    ports:
      - "8545:8545"
    logging: *default-logging

  backend:
    image: blockchain-emr-backend:local
    build:
      context: ../backend
    container_name: emr-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-emr}
      DB_USERNAME: ${MYSQL_USER:-emr}
      DB_PASSWORD: ${MYSQL_PASSWORD:-emr_password}
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-in-production-123456}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-kubo}
      IPFS_API_URL: http://ipfs:5001
      IPFS_GATEWAY_URL: http://ipfs:8080/ipfs
      BLOCKCHAIN_RPC_URL: http://anvil:8545
      BLOCKCHAIN_CONTRACT_ADDRESS: ${BLOCKCHAIN_CONTRACT_ADDRESS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_FILE: /app/logs/blockchain-emr-api.log
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      ipfs:
        condition: service_started
      anvil:
        condition: service_started
    volumes:
      - backend-logs:/app/logs
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: emr-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
    logging: *default-logging

  mysql-backup:
    image: mysql:8.4
    container_name: emr-mysql-backup
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-emr}
      MYSQL_USER: ${MYSQL_USER:-emr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-emr_password}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    entrypoint: ["/bin/bash", "/scripts/mysql-backup.sh"]
    volumes:
      - ./backup/mysql-backup.sh:/scripts/mysql-backup.sh:ro
      - mysql-backups:/backups
    depends_on:
      mysql:
        condition: service_healthy
    logging: *default-logging

volumes:
  mysql-data:
  ipfs-data:
  ipfs-staging:
  backend-logs:
  prometheus-data:
  mysql-backups:
