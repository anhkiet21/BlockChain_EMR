services:
  mysql:
    image: mysql:8.4
    container_name: emr-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-emr}
      MYSQL_USER: ${MYSQL_USER:-emr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-emr_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  ipfs:
    image: ipfs/kubo:v0.32.1
    container_name: emr-ipfs
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8081:8080"
    volumes:
      - ipfs-data:/data/ipfs
      - ipfs-staging:/export

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: emr-anvil
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337"]
    ports:
      - "8545:8545"

volumes:
  mysql-data:
  ipfs-data:
  ipfs-staging:

